# Сборка APK для Android в облаке GitHub.
# Запускается при каждой загрузке кода в репозиторий или вручную (Actions → Android APK → Run workflow).
# Готовый файл — в разделе Releases репозитория (удобно качать с телефона)
# и во вкладке Actions, в разделе Artifacts внизу запуска.
name: Android APK

on:
  push:
  workflow_dispatch:

# Нужно, чтобы выложить APK в раздел Releases
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 собирается на Java 21
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm ci

      - name: Собрать игру и перенести в Android-проект
        run: npm run build:android

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/debug/app-debug.apk smena-na-pvz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: smena-na-pvz-apk
          path: smena-na-pvz.apk

      # Чтобы скачать APK прямо с телефона: Releases → последняя сборка → smena-na-pvz.apk
      - name: Выложить в Releases
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Сборка ${{ github.run_number }}
          body: APK для установки на Android. Скачай smena-na-pvz.apk и открой на телефоне.
          files: smena-na-pvz.apk
          make_latest: true
