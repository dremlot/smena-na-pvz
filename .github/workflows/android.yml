# Сборка APK для Android в облаке GitHub.
# Запускается при каждой загрузке кода в репозиторий или вручную (Actions → Android APK → Run workflow).
# Готовый файл — во вкладке Actions, в разделе Artifacts внизу запуска.
name: Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 собирается на Java 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Установить зависимости
        run: npm ci

      - name: Собрать игру и перенести в Android-проект
        run: npm run build:android

      - name: Собрать APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Переименовать
        run: cp android/app/build/outputs/apk/debug/app-debug.apk smena-na-pvz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: smena-na-pvz-apk
          path: smena-na-pvz.apk
